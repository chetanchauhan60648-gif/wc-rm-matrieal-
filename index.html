<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>RM Store – Raw Material Warehouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#f3f6fb;--card:#ffffff;--bd:#d5dbee;--tx:#1a1650;--mu:#5d6590;--g:#12a05f;--b:#0898d0;--p:#8b5cf6;--o:#f08a3c;--r:#ef5b45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:inherit}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#0898d01f,transparent),var(--bg);color:var(--tx);font:14px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{padding:14px;border-right:1px solid #e6ecf8;background:#ffffff}
.logo{font-weight:800;font-size:20px;letter-spacing:1px}.wclogo{margin-bottom:12px}.wclogo img{display:block;width:100%;height:auto}.logo small{display:block;color:#0898d0;font-size:12px;letter-spacing:0;font-weight:600}
nav button{display:flex;gap:10px;align-items:center;width:100%;margin:6px 0;padding:11px 12px;border:0;border-radius:10px;background:none;color:var(--tx);font:inherit;cursor:pointer;text-align:left}
nav button.on{background:var(--b);color:#fff}nav button:hover:not(.on){background:#e6ecf8}
.c{box-shadow:0 1px 3px #30288814}aside{box-shadow:1px 0 6px #3028880d}main{padding:16px;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
header h1{margin:0;font-size:20px}header span{color:var(--mu)}
.g{display:grid;gap:12px}.k5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.r2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px}
.c{background:linear-gradient(160deg,#ffffff,#ffffff);border:1px solid var(--bd);border-radius:14px;padding:14px;min-width:0}
.c h3{margin:0 0 10px;font-size:15px}.kpi b{font-size:28px;display:block}.kpi span{color:var(--mu);font-size:12px}
.kpi.a{border-color:#1c7a55}.kpi.b{border-color:#9a4a38}.kpi.c2{border-color:#4a3aa8}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}.btn.g2{background:#13854f}.btn.o{background:#c4622a}.btn.s{background:#302888}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;text-align:left;border-bottom:1px solid #e3e8f5;white-space:nowrap}th{color:var(--mu);font-weight:600;position:sticky;top:0;background:#ffffff}
.sc{overflow:auto;max-height:70vh;max-width:100%}.sc.sm{max-height:260px}
input,select{background:#f7f9fd;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px;font:inherit;width:100%}
.bar{height:9px;border-radius:5px;background:#e6ecf8;margin:4px 0 10px}.bar i{display:block;height:100%;border-radius:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:180px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
dialog{background:#ffffff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;width:min(460px,92vw)}dialog::backdrop{background:#000a}
dialog label{display:block;margin:8px 0 3px;color:var(--mu);font-size:12px}
@media(max-width:760px){body{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:4px;padding:8px}.logo{display:none}nav{display:flex}nav button{white-space:nowrap;width:auto}}
